<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      (() => {
        const appBase = '/college-complaint/';
        const currentPath = window.location.pathname.replace(new RegExp('^' + appBase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')), '/');
        const redirectPath = `${currentPath}${window.location.search}${window.location.hash}`;
        const target = `${appBase}?p=${encodeURIComponent(redirectPath)}`;
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>
